services:
  postgres:
    # Image with PostGIS installed; Alembic enables the extension.
    image: postgis/postgis:16-3.4
    container_name: datapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapulse}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI service using the same image as production.
  # Verify it locally against the Compose PostgreSQL service:
  #   docker compose up -d --build api   →  http://localhost:8000/health e /docs
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: datapulse-api
    container_name: datapulse-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Compose network, the database host is `postgres` rather than localhost.
      # This service-level value overrides the host-oriented .env URL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD:-datapulse}@postgres:5432/${POSTGRES_DB:-datapulse}
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # The frontend is not part of Compose. Vercel serves its production static build;
  # run it locally with `cd web && npm run dev`.

volumes:
  postgres_data:
