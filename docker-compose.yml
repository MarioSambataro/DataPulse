services:
  postgres:
    # Immagine con PostGIS preinstallato (estensione abilitata via migrazione Alembic).
    image: postgis/postgis:16-3.4
    container_name: datapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapulse}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API FastAPI — stessa immagine usata in produzione (Dockerfile root, SEZIONE 10).
  # Serve a verificare in locale l'immagine contro il Postgres del compose:
  #   docker compose up -d --build api   →  http://localhost:8000/health e /docs
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: datapulse-api
    container_name: datapulse-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro la rete del compose il DB è l'host 'postgres', non 'localhost'.
      # Questo override vince sul DATABASE_URL del .env (che punta a localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-datapulse}:${POSTGRES_PASSWORD:-datapulse}@postgres:5432/${POSTGRES_DB:-datapulse}
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Il frontend (web/) NON gira qui: in produzione è build statica su Vercel
  # (vercel.json + VITE_API_URL → backend pubblico). In locale: cd web && npm run dev.

volumes:
  postgres_data:
