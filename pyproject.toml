[project]
name = "datapulse"
version = "0.1.0"
description = "DataPulse — console di monitoraggio geo-tettonico (ETL + API)"
requires-python = ">=3.12"
dependencies = []

# Optional groups keep installation scoped to individual application layers.
[project.optional-dependencies]
etl = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]
# Database and migrations; psycopg binary avoids local libpq builds.
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    "python-dotenv>=1.0",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
include = ["etl*", "api*", "db*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["etl", "api", "db"]
# Alembic migration boilerplate is excluded from noisy lint rules.
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["etl", "api", "db"]
addopts = "-q"
