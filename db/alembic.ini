# DataPulse Alembic migrations.
# The database URL comes from DATABASE_URL or .env in migrations/env.py.
# Run from the repository root: alembic -c db/alembic.ini upgrade head

[alembic]
# %(here)s is the db directory, keeping paths independent from the current directory.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

# Revision filename format: <slug>_<description>.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
