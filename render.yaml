# Render Blueprint — DataPulse API.
# Il database persistente vive su Neon Free (PostgreSQL + PostGIS): la relativa
# connection string viene inserita nel Dashboard Render come secret DATABASE_URL.
# Il Blueprint crea soltanto il web service Docker dell'API.
#
# Le migrazioni girano all'avvio del container (docker-entrypoint.sh, RUN_MIGRATIONS=1):
# i pre-deploy/release command di Render sono solo a pagamento, l'entrypoint è
# l'equivalente free-tier (alembic upgrade head è idempotente).
#
# Uso: Render Dashboard → New → Blueprint → punta a questo repo. Durante la
# creazione inserire DATABASE_URL (Neon) e CORS_ALLOW_ORIGINS (origin Vercel).

services:
  - type: web
    name: datapulse-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Connection string Neon diretta, con sslmode=require. Il valore è segreto.
      - key: DATABASE_URL
        sync: false
      # Origin Vercel di produzione: da valorizzare a mano nel dashboard (non in repo).
      # Es.: https://datapulse.vercel.app
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Applica le migrazioni all'avvio (vedi docker-entrypoint.sh).
      - key: RUN_MIGRATIONS
        value: "1"
