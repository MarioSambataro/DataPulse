# Render Blueprint for the DataPulse API.
# Persistent PostgreSQL/PostGIS data lives on Neon Free. Add its connection string
# to the Render dashboard as the DATABASE_URL secret. This Blueprint creates only
# the Docker web service.
#
# Migrations run at container startup because Render pre-deploy commands require a
# paid plan. `alembic upgrade head` is idempotent.
#
# Usage: Render Dashboard → New → Blueprint. During creation, configure
# DATABASE_URL for Neon and CORS_ALLOW_ORIGINS for the Vercel origin.

services:
  - type: web
    name: datapulse-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Direct Neon connection string with sslmode=require; keep this value secret.
      - key: DATABASE_URL
        sync: false
      # Production Vercel origin, configured manually in the dashboard.
      # Example: https://datapulse.vercel.app
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # Apply migrations at startup; see docker-entrypoint.sh.
      - key: RUN_MIGRATIONS
        value: "1"
