name: ETL Earthquakes (USGS)

# Hourly USGS earthquake ingestion. Deterministic IDs and upserts make repeated
# runs safe. The 24-hour source window also recovers missed schedules.
on:
  schedule:
    # Every hour at minute zero; GitHub Actions schedules use UTC.
    - cron: "0 * * * *"
  # Manual trigger for workflow verification.
  workflow_dispatch:

# Prevent overlapping runs; the following 24-hour window safely recovers a skipped job.
concurrency:
  group: etl-earthquakes
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest USGS earthquakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (etl + db)
        run: pip install -e ".[etl,db]"
      - name: Run ETL earthquakes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.jobs.earthquakes
