name: ETL Volcanoes (GVP)

# Daily ingestion from the weekly Smithsonian GVP report. Weekly deterministic
# IDs make intra-week runs idempotent, while a daily schedule self-heals network,
# runner, or publication delays on the following day.
on:
  schedule:
    # Every day at 06:00 UTC.
    - cron: "0 6 * * *"
  # Manual trigger for workflow verification.
  workflow_dispatch:

concurrency:
  group: etl-volcanoes
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest GVP volcanoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (etl + db)
        run: pip install -e ".[etl,db]"
      - name: Run ETL volcanoes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.jobs.volcanoes
